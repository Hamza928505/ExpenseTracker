  <div class="et-main">

    <header class="et-topbar">
      <h1 class="topbar-title">Transactions</h1>
      <div class="topbar-right">
        <div class="month-pill">
          <button class="mpill-btn" onclick="changeMonth(-1)" aria-label="Previous month"><i data-icon="chevronLeft"></i></button>
          <span class="mpill-label"></span>
          <button class="mpill-btn" onclick="changeMonth(1)" aria-label="Next month"><i data-icon="chevronRight"></i></button>

      <div class="et-card" id="txList"></div>

      <div class="pb-4"></div>
    </div>

<!-- ════════════════════════════════════════
     ADD TRANSACTION — bottom sheet on mobile, centred dialog on md+
     ════════════════════════════════════════ -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-handle"></div>

  <div class="sheet-head">
    <h2 class="sheet-title" id="sheetTitle">New transaction</h2>
    <button class="icon-btn" onclick="closeSheet()" aria-label="Close"><i data-icon="x"></i></button>
  </div>

  <div class="sheet-body">
    <div class="type-seg" role="group" aria-label="Transaction type">
      <button class="type-seg-btn sel-inc" id="btnInc" onclick="setType('income')" aria-pressed="true"><i data-icon="arrowIn"></i>Money in</button>
      <button class="type-seg-btn"         id="btnExp" onclick="setType('expense')" aria-pressed="false"><i data-icon="arrowOut"></i>Money out</button>
    </div>

    <div class="et-field">
      <label class="et-label" for="fAmt">Amount</label>
      <div class="amount-field">
        <input class="et-input big" id="fAmt" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" autocomplete="off"/>
        <span class="amount-cur" id="fAmtCur">JOD</span>
      </div>
      <div class="amount-note" id="fAmtNote" hidden></div>
    </div>

    <div class="et-field">
      <label class="et-label" for="fDesc">Description <span style="font-weight:500">(optional)</span></label>
      <input class="et-input" id="fDesc" type="text" placeholder="What was this for?" autocomplete="off"/>
    </div>

    <div class="et-field">
      <div class="et-label-row">
        <span class="et-label" id="fCatLabel">Category</span>
        <button type="button" class="link-btn" onclick="openCategoryDialog(mode)">
          <i data-icon="plus"></i>New category
        </button>
      </div>
      <div class="cat-picker" id="fCatPicker" role="radiogroup" aria-labelledby="fCatLabel"></div>
    </div>

    <div class="et-field">
      <label class="et-label" for="fDate">Date</label>
      <input class="et-input" id="fDate" type="date"/>
    </div>

    <label class="check-row" for="fRecurring">
      <input type="checkbox" id="fRecurring"/>
      <span>
        <span class="check-text d-block">Repeat monthly</span>
        <span class="check-sub d-block">We will add it again each month</span>
      </span>
    </label>

    <button class="et-btn-accent" onclick="addTx()">Add transaction</button>
  </div>
</div>

<script src="shared.js"></script>
<script src="transactions.js"></script>

<script>
  /* Drag-to-scroll for the filter chip bar (pointer devices only —
     touch already scrolls natively). A drag past the threshold
     suppresses the click so it does not select a chip. */
  (function () {
    const bar = document.getElementById('chipBar');
    let down = false, startX = 0, startScroll = 0, moved = 0;

    bar.addEventListener('mousedown', e => {
      down = true; moved = 0;
      startX = e.pageX;
      startScroll = bar.scrollLeft;
      bar.style.userSelect = 'none';
    });

    bar.addEventListener('mousemove', e => {
      if (!down) return;
      e.preventDefault();
      const walk = e.pageX - startX;
      moved = Math.abs(walk);
      bar.scrollLeft = startScroll - walk;
    });

    const end = () => {
      down = false;
      bar.style.removeProperty('user-select');
    };
    bar.addEventListener('mouseleave', end);
    bar.addEventListener('mouseup', end);

    bar.addEventListener('click', e => {
      if (moved > 5) { e.preventDefault(); e.stopPropagation(); }
      moved = 0;
    }, true);
  })();
</script>
