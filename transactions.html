<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Transactions · ExpenseTracker</title>
  <meta name="description" content="Every transaction for the month, grouped by day and filterable by category."/>

  <!-- Apply the stored theme before first paint so there is no flash of the wrong one -->
  <script>
    (function () {
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('et_theme') === 'dark' ? 'dark' : 'light'
        );
      } catch (e) { /* private mode — fall back to light */ }
    })();
  </script>

  <!-- PWA / home-screen icons -->
  <link rel="manifest" href="manifest.json?v=3"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="ExpenseTracker"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#f6f6f4"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=3"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png?v=3"/>

  <!-- Bootstrap 5.3 — grid and spacing utilities only -->
  <link rel="stylesheet" href="libs/bootstrap.min.css"/>
  <script src="libs/bootstrap.bundle.min.js" defer></script>

  <!-- Plus Jakarta Sans, served from libs/fonts -->
  <link rel="stylesheet" href="libs/font.css"/>

  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="libs/sweetalert2.min.css"/>
  <script src="libs/sweetalert2.all.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="shared.css"/>
  <link rel="stylesheet" href="transactions.css"/>
</head>
<body>

<div class="app-shell">

  <!-- ════════════════════════════════════════
       SIDEBAR — lg and above
       ════════════════════════════════════════ -->
  <aside class="et-sidebar">
    <a href="index.html" class="sb-logo">
      <span class="logo-mark"><i data-icon="wallet"></i></span>
      <span>
        <span class="logo-text d-block">ExpenseTracker</span>
        <span class="logo-sub d-block">Personal finance</span>
      </span>
    </a>

    <nav class="sb-nav" aria-label="Main">
      <a href="index.html"        class="sb-link"><i data-icon="home"></i> Home</a>
      <a href="transactions.html" class="sb-link active" aria-current="page"><i data-icon="receipt"></i> Transactions</a>
      <a href="settings.html"     class="sb-link"><i data-icon="settings"></i> Settings</a>
      <button class="sb-add-btn" onclick="openSheet()"><i data-icon="plus"></i> Add transaction</button>
    </nav>

    <div class="sb-bottom">
      <div class="sb-theme-row">
        <span>Dark mode</span>
        <label class="et-toggle">
          <input type="checkbox" id="darkToggle" onchange="toggleTheme()" aria-label="Dark mode"/>
          <span class="et-toggle-track"></span>
        </label>
      </div>
      <div class="sb-version">ExpenseTracker v2.0</div>
    </div>
  </aside>

  <div class="et-main">

    <header class="et-topbar">
      <h1 class="topbar-title">Transactions</h1>
      <div class="topbar-right">
        <div class="month-pill">
          <button class="mpill-btn" onclick="changeMonth(-1)" aria-label="Previous month"><i data-icon="chevronLeft"></i></button>
          <span class="mpill-label"></span>
          <button class="mpill-btn" onclick="changeMonth(1)" aria-label="Next month"><i data-icon="chevronRight"></i></button>
        </div>
        <button class="icon-btn theme-btn-top" id="themeBtn" onclick="toggleTheme()" aria-label="Switch theme"><i data-icon="moon"></i></button>
      </div>
    </header>

    <div class="page-wrap flex-grow-1">

      <div class="d-flex align-items-center justify-content-between mb-2">
        <h2 class="sec-title">Your activity</h2>
        <span class="sec-badge" id="txBadge">0 transactions</span>
      </div>

      <!-- Filter chips: native touch-scroll on mobile, drag-to-scroll with a mouse.
           Rendered from the live category list so custom ones appear here too. -->
      <div class="filter-scroll-wrap mb-3" id="chipBar" role="group" aria-label="Filter transactions">
        <div class="filter-chips" id="filterChips"></div>
      </div>

      <div class="et-card" id="txList"></div>

      <div class="pb-4"></div>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════
     BOTTOM NAV — xs to md
     ════════════════════════════════════════ -->
<nav class="et-bottom-nav" aria-label="Main">
  <a href="index.html"        class="bnav-btn"><i data-icon="home"></i>Home</a>
  <a href="transactions.html" class="bnav-btn active" aria-current="page"><i data-icon="receipt"></i>Transactions</a>
  <button class="bnav-btn bnav-add" onclick="openSheet()">
    <span class="bnav-add-icon"><i data-icon="plus"></i></span>
    <span>Add</span>
  </button>
  <a href="settings.html"     class="bnav-btn"><i data-icon="settings"></i>Settings</a>
</nav>

<!-- ════════════════════════════════════════
     ADD TRANSACTION — bottom sheet on mobile, centred dialog on md+
     ════════════════════════════════════════ -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-handle"></div>

  <div class="sheet-head">
    <h2 class="sheet-title" id="sheetTitle">New transaction</h2>
    <button class="icon-btn" onclick="closeSheet()" aria-label="Close"><i data-icon="x"></i></button>
  </div>

  <div class="sheet-body">
    <div class="type-seg" role="group" aria-label="Transaction type">
      <button class="type-seg-btn sel-inc" id="btnInc" onclick="setType('income')" aria-pressed="true"><i data-icon="arrowIn"></i>Money in</button>
      <button class="type-seg-btn"         id="btnExp" onclick="setType('expense')" aria-pressed="false"><i data-icon="arrowOut"></i>Money out</button>
    </div>

    <div class="invoice-scan">
      <input id="fInvoice" type="file" accept="image/*" capture="environment" hidden onchange="scanInvoice(this)"/>
      <button type="button" class="et-btn-ghost" id="fScanBtn" onclick="document.getElementById('fInvoice').click()">
        <i data-icon="camera"></i>Scan invoice
      </button>
      <div class="invoice-scan-status" id="fScanStatus" role="status" aria-live="polite"></div>
    </div>

    <div class="et-field">
      <label class="et-label" for="fAmt">Amount</label>
      <div class="amount-field">
        <input class="et-input big" id="fAmt" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" autocomplete="off"/>
        <span class="amount-cur" id="fAmtCur">JOD</span>
      </div>
      <div class="amount-note" id="fAmtNote" hidden></div>
    </div>

    <div class="et-field">
      <label class="et-label" for="fDesc">Description <span style="font-weight:500">(optional)</span></label>
      <input class="et-input" id="fDesc" type="text" placeholder="What was this for?" autocomplete="off"/>
    </div>

    <div class="et-field">
      <div class="et-label-row">
        <span class="et-label" id="fCatLabel">Category</span>
        <button type="button" class="link-btn" onclick="openCategoryDialog(mode)">
          <i data-icon="plus"></i>New category
        </button>
      </div>
      <div class="cat-picker" id="fCatPicker" role="radiogroup" aria-labelledby="fCatLabel"></div>
    </div>

    <div class="et-field">
      <label class="et-label" for="fDate">Date</label>
      <input class="et-input" id="fDate" type="date"/>
    </div>

    <label class="check-row" for="fRecurring">
      <input type="checkbox" id="fRecurring"/>
      <span>
        <span class="check-text d-block">Repeat monthly</span>
        <span class="check-sub d-block">We will add it again each month</span>
      </span>
    </label>

    <button class="et-btn-accent" onclick="addTx()">Add transaction</button>
  </div>
</div>

<script src="shared.js"></script>
<script src="invoice.js"></script>
<script src="transactions.js"></script>

<script>
  /* Drag-to-scroll for the filter chip bar (pointer devices only —
     touch already scrolls natively). A drag past the threshold
     suppresses the click so it does not select a chip. */
  (function () {
    const bar = document.getElementById('chipBar');
    let down = false, startX = 0, startScroll = 0, moved = 0;

    bar.addEventListener('mousedown', e => {
      down = true; moved = 0;
      startX = e.pageX;
      startScroll = bar.scrollLeft;
      bar.style.userSelect = 'none';
    });

    bar.addEventListener('mousemove', e => {
      if (!down) return;
      e.preventDefault();
      const walk = e.pageX - startX;
      moved = Math.abs(walk);
      bar.scrollLeft = startScroll - walk;
    });

    const end = () => {
      down = false;
      bar.style.removeProperty('user-select');
    };
    bar.addEventListener('mouseleave', end);
    bar.addEventListener('mouseup', end);

    bar.addEventListener('click', e => {
      if (moved > 5) { e.preventDefault(); e.stopPropagation(); }
      moved = 0;
    }, true);
  })();
</script>

</body>
</html>
